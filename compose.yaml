services:
  mcp-gate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-gate
    restart: unless-stopped
    ports:
      - "${MCPGATE_BIND:-0.0.0.0}:8090:8000"  # MCPGATE_BIND in .env: LAN IP or 127.0.0.1
    volumes:
      - ./data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
